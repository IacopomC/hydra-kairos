---
# LCD config for the TBD pedestrian dataset (CMU CaBot + ZED2, single
# tall-ceiling hall). Differences from default.yaml, with rationale:
#
# - object_extraction / places_extraction max_radius_m: 13.0 -> 5.0.
#   13m subgraphs in TBD's open hall pulled ~137 places, yielding
#   137*137 = 18,769 dense correspondences per place-LC TEASER PMC solve
#   and OOM'd a 16 GB laptop. 5m matches the GNN config (see
#   doc/lcd/params.md §2) and cuts per-LC TEASER cost ~30x.
#
# - agent.min_score: 0.040 -> 0.001. The 0.040 default was tuned for
#   Kimera-VIO's BoW stream. Offline ORB+ORBvoc.txt produces L1 scores
#   ~0.005-0.012 for true revisits in this scene (verified via the
#   searchLeafDescriptors INFO diagnostic). 0.001 lets candidates through
#   to BowAgentSolver, which applies its own (also lower) threshold.
#
# - bow_agent.min_score: 0.005 (BowAgentSolver default is 0.05). Matches
#   the empirical score scale of ORB+ORBvoc on TBD revisits. dedup
#   window left at the C++ default of 30s.
lcd_visualizer_ns: /dsg/lcd_visualizer
lcd_agent_horizon_s: 3.5
descriptor_creation_horizon_m: 3.0
lcd:
  enable_agent_registration: true
  place_histogram_config: {min: 0.5, max: 2.5, bins: 30}
  num_semantic_classes: 20
  object_extraction: {fixed_radius: true, max_radius_m: 5.0}
  places_extraction: {fixed_radius: true, max_radius_m: 5.0}
  agent:
    min_time_separation_s: 25.0
    min_score: 0.001
    min_registration_score: 0.001
    max_registration_matches: 2
    min_score_ratio: 0.95
    min_match_separation_m: 0.0
    type: L1
  objects:
    search:
      min_time_separation_s: 25.0
      min_score: 0.3
      min_registration_score: 0.93
      max_registration_matches: 2
      min_score_ratio: 0.9
      min_match_separation_m: 5.0
      type: L1
    registration:
      min_correspondences: 5
      min_inliers: 5
      log_registration_problem: false
      registration_output_path: ''
      recreate_subgraph: false
  places:
    search:
      min_time_separation_s: 60.0
      min_score: 0.3
      min_registration_score: 0.45
      max_registration_matches: 2
      min_score_ratio: 0.85
      min_match_separation_m: 8.0
      type: L1
  teaser:
    estimate_scaling: false
    noise_bound: 0.100
    cbar2: 1.0
    rotation_gnc_factor: 1.4
    rotation_max_iterations: 100
    rotation_cost_threshold: 1.0e-6
    kcore_heuristic_threshold: 0.5
    inlier_selection_mode: PMC_HEU
    max_clique_time_limit: 3600
bow_agent:
  min_score: 0.005
  dedup_window_s: 30.0
